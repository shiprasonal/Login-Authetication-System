<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="register">
  <main class="card">
    <h1>Create account</h1>
    <p class="sub">Register to open your dashboard.</p>

    <form id="registerForm" novalidate>
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" placeholder="e.g. riya_21">

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com">

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="new-password" placeholder="Min 8 characters, 1 number">
      <p class="hint">At least 8 characters and 1 number.</p>

      <p id="message" class="message" role="alert" hidden></p>
      <button type="submit" class="btn">Register</button>
    </form>

    <p class="switch">Already have an account? <a href="login.html">Login</a></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
